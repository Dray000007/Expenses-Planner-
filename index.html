<div class="kp" style="margin-top:8px">${ek('Total income',f(T.inc),'income',S.ov.income!=null)}${ek('Fixed expenses',f(T.fix),'fixed',S.ov.fixed!=null)}${ek('Variable expenses',f(T.vt),'variable',S.ov.variable!=null)}${ek('Savings · '+(T.inc?(T.sav/T.inc*100).toFixed(1):0)+'%',f(T.sav),'savings',S.ov.savings!=null)}
<div class="kpi ed cb" onclick="openForm('fig',null,'cardbal')"><small>Credit card owed ✎</small><b class="${T.cbal>0?'bad':'ok'}">${f(-T.cbal)}</b></div>
</div><small style="display:block;margin-top:8px">Tap any figure to edit it for this month. Available: ${f(T.avail)} (opening ${f(T.op)} + income ${f(T.inc)}) · Total out: ${f(T.out)} (fixed ${f(T.fix)} + variable ${f(T.vt)} + savings ${f(T.sav)})</small></section>
<section style="--sc:#db2777"><div class="hd"><h2>Where the month goes</h2></div>${rows.map(([n,v,c])=>`<div class="br"><span>${esc(n)}</span><div class="bt"><i style="width:${v/mx*100}%;background:${c}"></i></div><em>${f(v)}</em></div>`).join('')||'<small>Nothing yet.</small>'}</section>
<section style="--sc:#16a34a"><div class="hd"><h2>Income</h2><button class="p" onclick="openForm('income')">+ Add</button></div>
${S.income.map(i=>row('income',i,`${dl(i.day)} · ${i.freq}${i.freq==='weekly'?` · ${occ(i).length} paydays this month`:''}`,f(i.amount*occ(i).length)+(i.freq==='weekly'?`<small>${f(i.amount)} each</small>`:''))).join('')}
<div class="row"><div class="g"><b>Total monthly income</b></div><div class="a">${f(T.inc)}</div></div></section>
<section style="--sc:#6366f1"><div class="hd"><h2>Fixed expenses</h2><button class="p" onclick="openForm('fixed')">+ Add</button></div>
${S.fixed.map(x=>row('fixed',x,'Due '+dl(x.day),f(x.amount))).join('')}
<div class="row"><div class="g"><b>Total fixed</b></div><div class="a">${f(T.fix)}</div></div></section>
<section style="--sc:#f59e0b"><div class="hd"><div><h2>Variable expenses</h2><small>Total ${f(T.caps)} = other ${f(T.lcap)} + card payment ${f(T.caps-T.lcap)} · Spent ${f(T.spent)}</small></div><button class="p" onclick="openForm('vars')">+ Category</button></div>
${S.vars.map(c=>{const s=sp(c),l=c.cap-s,pc=c.cap?Math.min(100,s/c.cap*100):s?100:0;return`<div class="cat"><div class="cr"><b>${esc(c.name)}</b><span><b class="${l<0?'bad':''}">${f(s)}</b> / ${f(c.cap)}</span></div>
${vsub(c)}<div class="pr"><i style="width:${pc}%;background:${l<0?'var(--bad)':pc>80?'#f59e0b':'var(--ok)'}"></i></div>
<small class="${l<0?'bad':''}">${l<0?'Over by '+f(-l):f(l)+' left'}</small>
${c.card?'<small>Debt repayment: counted once here and tracked in the Credit Card section.</small>':c.auto?'':`<div class="wi">What if cap £<input type="text" inputmode="decimal" placeholder="e.g. ${Math.max(0,Math.round(c.cap*.7))}" oninput="wi(this,'${c.id}')"><span id="wi-${c.id}"></span></div>`}
<div class="bs"><button class="sm p" onclick="openForm('log',null,'${c.id}')">+ Log spend</button><button class="sm" onclick="openForm('vars','${c.id}')">Edit</button><button class="sm" onclick="del('vars','${c.id}')">Delete</button></div>
${c.log.length?`<details ${OPEN.has(c.id)?'open':''} ontoggle="this.open?OPEN.add('${c.id}'):OPEN.delete('${c.id}')"><summary>${c.log.length} logged</summary>${c.log.map(l=>`<div class="row"><div class="g"><b>${f(l.amt)}</b><small>${fd(l.d)}${l.note?' · '+esc(l.note):''}</small></div><button class="ic" onclick="openForm('log','${l.id}','${c.id}')" aria-label="Edit">✎</button><button class="ic" onclick="delLog('${c.id}','${l.id}')" aria-label="Delete">✕</button></div>`).join('')}</details>`:''}</div>`}).join('')}</section>
<section style="--sc:#14b8a6"><div class="hd"><h2>Savings & goals</h2><button class="p" onclick="openForm('savings')">+ Add</button></div>
${S.savings.map(x=>row('savings',x,`${x.ngn>0&&x.rate>0?'₦'+x.ngn.toLocaleString('en-GB')+' at ₦'+x.rate.toLocaleString('en-GB',{maximumFractionDigits:2})+'/£ · ':''}Target ${f(x.target)}${x.due?' · due '+fd(x.due):''}`,f(x.amount)+'<small>this month</small>')).join('')}
<div class="row"><div class="g"><b>Total planned savings</b><small>Savings rate ${(T.inc?T.sav/T.inc*100:0).toFixed(1)}% of income</small></div><div class="a">${f(T.sav)}</div></div>
</section>
${grpSec()}${cardSec()}<section style="--sc:#9333ea"><div class="hd"><h2>Where I can save more</h2>${sg.length?`<button class="sm p" onclick="applyAll()">Apply all</button>`:''}</div>
<small>Biggest living costs</small>${top.map(c=>`<div class="sg"><span>${esc(c.name)}</span><b>${f(base(c))} · ${T.lcap?Math.round(base(c)/T.lcap*100):0}%</b></div>`).join('')}
${small}
<div style="margin-top:10px"><small>Suggested cuts</small></div>
${sg.length?sg.map(s=>`<div class="sg"><div><b>${esc(s.c.name)}</b><br><small>${s.over?'Over budget':'Trim idea'}: cut by ${f(s.cut)} → cap ${f(s.nc)}</small></div><button class="sm" onclick="setCap('${s.c.id}',${s.nc})">Apply</button></div>`).join('')+`<div class="al g" style="margin-top:8px">Follow all and you save ${f(tot)} a month. Money left over becomes ${f(T.left+tot)}.</div>`:'<div class="al g">Nothing to cut right now.</div>'}</section>`}
function wi(el,id){const c=S.vars.find(x=>x.id===id),v=num(el.value),o=$('#wi-'+id);if(el.value.trim()===''){o.innerHTML='';return}
 const s=sp(c),sv=Math.max(c.cap,s)-Math.max(v,s);
 o.innerHTML=(v<s?`Already spent ${f(s)}. `:'')+`Saves <b class="${sv>0?'ok':''}">${f(sv)}</b> → left over ${f(T.left+sv)} <button class="sm" onclick="setCap('${id}',${v})">Apply</button>`}
function setCap(id,v){S.vars.find(c=>c.id===id).cap=Math.max(0,v);render()}
function applyAll(){sugg().forEach(s=>s.c.cap=s.nc);render()}
const SC={
 income:{d:{name:'',amount:'',day:1,freq:'monthly'},f:[['name','Source name','text'],['amount','Amount (£)','number'],['day','Payday date','day'],['freq','How often','monthly|weekly']]},
 fixed:{d:{name:'',amount:'',day:1,grp:'no'},f:[['name','Name','text'],['amount','Amount (£)','number'],['day','Due date','day'],['grp','Savings group payment?','no|yes']]},
 vars:{d:{name:'',cap:'',mode:'fixed amount',due:'',ngn:0,rate:0},f:[['name','Name','text'],['cap','Budget (£)','number'],['mode','Budget type','automatic|fixed amount'],['due','Due date (optional)','date'],['ngn','Amount in naira ₦ (optional, sets the £ budget)','numopt'],['rate','Exchange rate, ₦ per £ (optional)','numopt']]},
 grp:{d:{name:'',start:''},f:[['name','Group name','text'],['start','Total saved before this month (£)','number']]},
 savings:{d:{name:'',amount:'',target:'',due:'',ngn:0,rate:0},f:[['name','Goal / pot','text'],['amount','Saving this month (£)','number'],['target','Target amount (£)','number'],['due','Due date (optional)','date'],['ngn','Amount in naira ₦ (optional, sets the £ amount)','numopt'],['rate','Exchange rate, ₦ per £ (optional)','numopt']]},
 month:{d:{month:''},f:[['month','Month','month']]},
 fig:{d:{amt:''},f:[['amt','Amount for this month (£)','number']]},
 card:{d:{name:'',start:''},f:[['name','Card name','text'],['start','Starting balance owed (£)','number']]},

function openForm(k,id,cid){
 const sc=SC[k],it=k==='card'?S.card:k==='grp'?S.grp:k==='month'?{month:S.month}:k==='log'&&id?((S.vars.find(c=>c.id===cid)||{log:[]}).log.find(l=>l.id===id)||{...sc.d}):k==='clog'&&id?(S.card.log.find(l=>l.id===id)||{...sc.d}):id?S[k].find(x=>x.id===id):{...sc.d};ED={k,id,cid};if(k==='fig')ED.cid=cid;
 $('#dt').textContent=(id?'Edit ':'Add ')+({income:'income',fixed:'fixed expense',vars:'variable category',savings:'saving',log:'spending',clog:'card spending'}[k]);
 if(k==='card')$('#dt').textContent='Edit credit card';
 if(k==='month')$('#dt').textContent='Change month';
 if(k==='grp')$('#dt').textContent='Edit savings group';
 if(k==='vars')it.mode=it.auto?'automatic':'fixed amount';
 if(k==='fixed')it.grp=it.group?'yes':'no';
 if(k==='fig'){it.amt=Math.round(figVal(cid)*100)/100;$('#dt').textContent='Edit '+FN[cid]}
 $('#ff').innerHTML=sc.f.map(([n,l,t])=>{const v=it[n];let inp;
  if(t==='day')inp=`<input name="${n}" type="date" required value="${S.month}-${p2(Math.min(v,T.dim))}">`;
  else if(t.includes('|'))inp=`<select name="${n}">${t.split('|').map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
  else inp=`<input name="${n}" type="${t==='number'||t==='numopt'?'text':t}" ${t==='number'?'inputmode="decimal" required':t==='numopt'?'inputmode="decimal"':n==='name'?'required':''} value="${t==='numopt'&&!v?'':esc(v)}">`;
  return`<label>${l}${inp}</label>`}).join('');
 if(k==='fig'){$('#ff').insertAdjacentHTML('beforeend',cid==='cardbal'?'<small>Enter the amount you owe on the card, e.g. 454.</small>':`<small>This replaces the total for this month only. New month goes back to the item totals.</small>${S.ov[cid]!=null?`<div style="margin-top:8px"><button type="button" class="sm" onclick="clearFig('${cid}')">Use item totals</button></div>`:''}`)}
 $('#dlg').showModal()}
function submitForm(e){e.preventDefault();const d=new FormData(e.target),o={};
 SC[ED.k].f.forEach(([n,l,t])=>{let v=d.get(n);if(t==='number'||t==='numopt')v=num(v);else if(t==='day')v=parseInt(String(v).slice(8))||1;o[n]=v});
 if(ED.k==='vars'){o.auto=o.mode==='automatic';delete o.mode;if(o.ngn>0&&o.rate>0)o.cap=Math.round(o.ngn/o.rate*100)/100}
 if(ED.k==='fixed'){o.group=o.grp==='yes';delete o.grp}
 if(ED.k==='savings'&&o.ngn>0&&o.rate>0)o.amount=Math.round(o.ngn/o.rate*100)/100;
 if(ED.k==='fig')setFig(ED.cid,o.amt);else if(ED.k==='grp')Object.assign(S.grp,o);else if(ED.k==='card')Object.assign(S.card,o);else if(ED.k==='month'){if(/^\d{4}-\d{2}$/.test(o.month))S.month=o.month}else if(ED.k==='clog'&&ED.id)Object.assign(S.card.log.find(l=>l.id===ED.id)||{},{amt:o.amt,note:o.note});else if(ED.k==='clog')S.card.log.push({id:uid(),amt:o.amt,note:o.note,d:new Date().toISOString().slice(0,10)});else if(ED.k==='log'&&ED.id)Object.assign(S.vars.find(x=>x.id===ED.cid).log.find(l=>l.id===ED.id)||{},{amt:o.amt,note:o.note});else if(ED.k==='log')S.vars.find(x=>x.id===ED.cid).log.push({id:uid(),amt:o.amt,note:o.note,d:new Date().toISOString().slice(0,10)});
 else if(ED.id)Object.assign(S[ED.k].find(x=>x.id===ED.id),o);else S[ED.k].push({id:uid(),...o});
 $('#dlg').close();render();toast(ED.id||ED.k==='card'||ED.k==='month'||ED.k==='grp'?'Saved':'Added')}
function toast(msg,undo){const t=$('#toast');t.style.display='flex';t.innerHTML=`<span>${msg}</span>`+(undo?'<button onclick="undo()">Undo</button>':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',6000)}
function snap(msg){UN=JSON.stringify(S);toast(msg,1)}
function undo(){if(UN){S=JSON.parse(UN);UN=null;$('#toast').style.display='none';render()}}
function del(k,id){snap('Deleted');S[k]=(S[k]||[]).filter(x=>x.id!==id);render()}
function delLog(cid,id){snap('Deleted');const c=S.vars.find(x=>x.id===cid);c.log=c.log.filter(l=>l.id!==id);render()}
function newMonth(){snap('Started a new month: fixed costs, income, savings and caps carried forward');
 S.opening=Math.round(T.end*100)/100;const[y,m]=ym(),d=new Date(y,m,1);S.month=d.getFullYear()+'-'+p2(d.getMonth()+1);S.vars.forEach(c=>c.log=[]);render()}
function confirmBox(title,html,ok,fn){$('#cdt').textContent=title;$('#cdb').innerHTML=html;$('#cok').textContent=ok;CB=fn;$('#cdlg').showModal()}
let CB;function confirmGo(){$('#cdlg').close();const fn=CB;CB=null;if(fn)fn()}
function resetAll(){confirmBox('Reset to starter values?',`<p>Income, fixed, variable, savings, the credit card (£754 owed) and the opening balance (£100) go back to the starter values.</p><p>Your ${(S.history||[]).length} archived month(s) are kept.</p><p>You’ll get an Undo for a few seconds.</p>`,'Reset',doReset)}
function doReset(){snap('Reset to starter values');const h=Array.isArray(S.history)?S.history:[],r=S.rolled;S=def();S.history=h;S.rolled=r||'';render()}
function delCardLog(id){snap('Deleted');S.card.log=S.card.log.filter(l=>l.id!==id);render()}
const FN={income:'total income',fixed:'total fixed expenses',variable:'total variable expenses',savings:'total savings',cardbal:'credit card balance owed'};
const figVal=c=>c==='cardbal'?T.cbal:c==='income'?T.inc:c==='fixed'?T.fix:c==='variable'?T.vt:T.sav;
function setFig(c,v){if(c==='cardbal')S.card.start=Math.round((v+T.cpay-T.cspend)*100)/100;else S.ov[c]=v}
function clearFig(c){S.ov[c]=null;$('#dlg').close();render();toast('Back to item totals')}
const ek=(l,v,k,e)=>`<div class="kpi ed" onclick="openForm('fig',null,'${k}')"><small>${l}${e?' · edited':''} ✎</small><b>${v}</b></div>`;
function vsub(c){const a=[];if(c.auto)a.push('Automatic: what’s left after fixed, savings and your other variable payments');if(c.ngn>0&&c.rate>0)a.push('₦'+c.ngn.toLocaleString('en-GB')+' at ₦'+c.rate.toLocaleString('en-GB',{maximumFractionDigits:2})+'/£');if(c.due)a.push('due '+fd(c.due));return a.length?`<small style="display:block;margin-bottom:4px">${a.join(' · ')}</small>`:''}
function togglePaid(){S.grp.paid=!S.grp.paid;render()}
function grpSec(){const g=S.grp,has=S.fixed.some(x=>x.group);
 return`<section style="--sc:#f59e0b"><div class="hd"><div><h2>Savings group — ${esc(g.name)}</h2><small>Your monthly payment is counted once, in Fixed expenses.</small></div><button class="sm" onclick="openForm('grp')">Edit</button></div>
<div class="row"><div class="g"><b>Monthly contribution</b><small>${has?'From the Fixed expense marked as the savings group payment':'Mark one Fixed expense as the savings group payment'}</small></div><div class="a">${f(T.gpay)}</div></div>
<div class="row"><div class="g"><b>Saved before this month</b></div><div class="a">${f(T.gstart)}</div></div>
<div class="row"><div class="g"><b>This month’s payment</b><small>${T.gpaid?'Marked as paid':'Not marked as paid yet'}</small></div><div class="a">${f(T.gpay)}</div><button class="sm ${T.gpaid?'':'p'}" onclick="togglePaid()">${T.gpaid?'Undo paid':'Mark paid'}</button></div>
<div class="row"><div class="g"><b>Total saved so far</b></div><div class="a">${f(T.gnow)}</div></div>
<div class="row"><div class="g"><b>Total after this month’s payment</b></div><div class="a ok">${f(T.gafter)}</div></div></section>`}
function cardSec(){const pc=T.cstart>0?Math.max(0,Math.min(100,T.cpay/T.cstart*100)):0,ow=T.cbal,cl=S.card.log||[];
 return`<section style="--sc:#e11d48"><div class="hd"><div><h2>Credit Card — ${esc(S.card.name)}</h2><small>Not counted in your totals. Only the payment in Variable counts, once.</small></div><button class="sm" onclick="openForm('card')">Edit card</button></div>
<div class="row"><div class="g"><b>Card</b></div><div class="a">${esc(S.card.name)}</div></div>
<div class="row"><div class="g"><b>Starting balance owed</b></div><div class="a">${f(-T.cstart)}</div></div>
<div class="row"><div class="g"><b>Payments this month</b><small>${S.vars.some(c=>c.card)?'Taken from “Credit card payment” in Variable':'Add a Variable category marked as the card payment'}</small></div><div class="a">${f(T.cpay)}</div></div>
<div class="row"><div class="g"><b>New spending on card</b></div><div class="a">${f(T.cspend)}</div><button class="sm p" onclick="openForm('clog')">+ Add</button></div>
<div class="row"><div class="g"><b>Current balance owed</b></div><div class="a ${ow>0?'bad':'ok'}">${f(-ow)}</div></div>
<div class="row"><div class="g"><b>Amount left to pay</b></div><div class="a">${f(Math.max(0,ow))}</div></div>
<div class="pr" style="margin:8px 0 4px"><i style="width:${pc}%;background:var(--ok)"></i></div><small>${pc.toFixed(1)}% of the starting balance paid off${ow<0?' · card is in credit by '+f(-ow):''}</small>
${cl.length?`<details ${OPEN.has('card')?'open':''} ontoggle="this.open?OPEN.add('card'):OPEN.delete('card')"><summary>${cl.length} card purchase(s)</summary>${cl.map(l=>`<div class="row"><div class="g"><b>${f(l.amt)}</b><small>${fd(l.d)}${l.note?' · '+esc(l.note):''}</small></div><button class="ic" onclick="openForm('clog','${l.id}')" aria-label="Edit">✎</button><button class="ic" onclick="delCardLog('${l.id}')" aria-label="Delete">✕</button></div>`).join('')}</details>`:''}</section>`}
const JSPDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
function loadPdf(){return new Promise((ok,no)=>{if(window.jspdf)return ok();const s=document.createElement('script');s.src=JSPDF;s.onload=ok;s.onerror=()=>no(new Error('pdf library'));document.head.appendChild(s)})}
async function saveBlob(name,blob){
 try{const d=typeof claude!=='undefined'&&await claude.use('downloads');if(d){await d.save({filename:name,data:blob});toast('Downloaded '+name);return}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Downloaded '+name)}
function summ(d){const sv=S,st=T;try{S=d;calc();return{...T}}finally{S=sv;T=st}}
function csvOf(d,t){const spd=c=>c.log.reduce((a,l)=>a+l.amt,0),z=v=>+v||0,r=[['Section','Name','Planned (GBP)','Actual (GBP)','Detail']];
 d.income.forEach(i=>r.push(['Income',i.name,i.amount*occ(i,t.dim).length,'',`${i.freq}, payday day ${i.day}`]));
 d.fixed.forEach(x=>r.push(['Fixed',x.name,x.amount,'','Due day '+x.day]));
 d.vars.forEach(c=>r.push([c.card?'Variable (credit card payment)':'Variable',c.name,c.cap,spd(c),'Left '+(c.cap-spd(c)).toFixed(2)]));
 d.vars.forEach(c=>c.log.forEach(l=>r.push(['Spending log',c.name,'',l.amt,l.d+(l.note?' '+l.note:'')])));
 d.savings.forEach(x=>r.push(['Savings',x.name,x.amount,'',`Target ${x.target}${x.due?', due '+x.due:''}${x.ngn>0&&x.rate>0?`, NGN ${x.ngn} at ${x.rate} per GBP`:''}`]));
 if(d.card&&t.cpay!=null)r.push(['Credit card','Starting balance owed',z(t.cstart),'',d.card.name||''],['Credit card','Payments this month',z(t.cpay),'','From Variable'],['Credit card','New spending on card',z(t.cspend),'',''],['Credit card','Current balance owed',z(t.cbal),'','Not counted in totals']);
 if(d.grp&&t.gpay!=null)r.push(['Savings group','Saved before this month',z(t.gstart),'',d.grp.name||''],['Savings group','Payment this month',z(t.gpay),'',t.gpaid?'Paid':'Not marked paid'],['Savings group','Total after this month’s payment',z(t.gafter),'','']);
 r.push(['Summary','Opening balance',z(t.op),'',''],['Summary','Total income',t.inc,'',''],['Summary','Total fixed',t.fix,'',''],['Summary','Total variable (living + card)',t.vt,t.spent,''],['Summary','Total savings',t.sav,'',(t.inc?t.sav/t.inc*100:0).toFixed(1)+'% of income'],['Summary','Money left at month end',t.left,'',''],['Summary','Projected end balance',t.end,'','']);
 return'\ufeff'+r.map(x=>x.map(v=>`"${String(typeof v==='number'?+v.toFixed(2):v).replace(/"/g,'""')}"`).join(',')).join('\n')}
function exportCsv(){saveBlob(`planner-${S.month}.csv`,new Blob([csvOf(S,T)],{type:'text/csv'}))}
async function makePdf(d,t){
 await loadPdf();const{jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:'a4'}),W=595,M=40;let y=0;
 const cl=s=>String(s).replace(/₦/g,'NGN ').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[^\x20-\x7E£]/g,'');
 const mny=n=>(n<0?'-':'')+'£'+Math.abs(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
 const[yy,mo]=d.month.split('-').map(Number),title=new Date(yy,mo-1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
